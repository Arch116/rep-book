<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>Workout Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">Routines</h1>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/routines" data-tab="routines">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Routines</span>
    </a>
    <a href="#/workout" data-tab="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>
      <span>Workout</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>
      <span>History</span>
    </a>
  </nav>

  <div id="rest-bar" class="rest-bar" hidden role="timer" aria-live="polite">
    <span class="rest-time"></span>
    <button data-rest="-15" aria-label="15 seconds less">−15</button>
    <button data-rest="15" aria-label="15 seconds more">+15</button>
    <button data-rest="skip">Skip</button>
  </div>

  <script src="store.js"></script>
  <script src="app.js"></script>
  <script src="workout.js"></script>
</body>
</html>
