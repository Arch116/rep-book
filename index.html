<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00142e">
  <title>Rep Book</title>
  <!-- Lets you add the app to your home screen. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rep Book">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <svg class="brand-mark" viewBox="96 136 320 240" aria-hidden="true"><path d="M128 216v80M176 168v176M336 168v176M384 216v80M176 256h160"/></svg>
      Rep Book
    </h1>
    <a id="sync-badge" class="sync-badge" href="#/account" hidden><i aria-hidden="true"></i><span></span></a>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/routines" data-tab="routines">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Routines</span>
    </a>
    <a href="#/workout" data-tab="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>
      <span>Workout</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>
      <span>History</span>
    </a>
  </nav>

  <div id="rest-bar" class="rest-bar" hidden role="timer" aria-live="polite">
    <span class="rest-time"></span>
    <button data-rest="-15" aria-label="15 seconds less">−15</button>
    <button data-rest="15" aria-label="15 seconds more">+15</button>
    <button data-rest="skip">Skip</button>
  </div>

  <!-- Chart.js draws the progress charts. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <!-- Supabase: online copy of your data and sign-in. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script src="workout.js"></script>
  <script src="history.js"></script>
  <script src="progress.js"></script>
  <script src="account.js"></script>
  <script src="backup.js"></script>
</body>
</html>
